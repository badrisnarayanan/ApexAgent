<template>
    <div class="viewer-container" style={themeStyle}>

        <!-- Summary bar -->
        <div class="summary">
            <c-apex-agent-usage-metrics
                class="summary-metrics"
                message-count={messageCount}
                cost={totals.cost}
                duration-ms={totals.durationMs}
                tool-call-count={totals.toolCallCount}
                input-tokens={totals.inputTokens}
                output-tokens={totals.outputTokens}
                cached-input-tokens={totals.cachedInputTokens}
                reasoning-tokens={totals.reasoningTokens}>
            </c-apex-agent-usage-metrics>
            <lightning-button-icon
                icon-name="utility:refresh"
                variant="border-filled"
                size="small"
                title="Refresh conversation"
                alternative-text="Refresh conversation"
                onclick={handleRefresh}>
            </lightning-button-icon>
        </div>

        <!-- Message list -->
        <div class="msg-list" onscroll={handleScroll}>
            <template for:each={_messages} for:item="msg">
                <c-apex-agent-message-turn
                    key={msg.id}
                    message={msg}
                    avatar-url={agentAvatarUrl}>
                </c-apex-agent-message-turn>
            </template>

            <!-- Empty state -->
            <template if:true={isEmpty}>
                <div class="empty-state">
                    <lightning-icon icon-name="utility:chat" size="medium" class="empty-icon"></lightning-icon>
                    <p class="empty-text">No messages in this thread yet.</p>
                </div>
            </template>
        </div>

        <!-- New message indicator pill -->
        <template if:true={_hasNewMessages}>
            <button class="new-msg-pill" type="button" onclick={handleScrollToBottom}>
                <lightning-icon icon-name="utility:down" size="xx-small"></lightning-icon>
                New message
            </button>
        </template>

    </div>
</template>
